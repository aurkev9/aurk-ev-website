<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUR-K EV | Admin</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="index.html"><span>AUR-K</span> EV <small>ADMIN</small></a><a href="index.html">View website ↗</a></header>
<main class="admin-wrap"><section id="loginPanel" class="panel login-panel"><p class="eyebrow">PRIVATE AREA</p><h1>Admin login</h1><p>Sign in with the admin account you create in Supabase Authentication.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="gold-btn" type="submit">Sign in</button><p id="loginMessage" class="message"></p></form></section>
<section id="dashboard" class="panel" hidden><div class="dash-head"><div><p class="eyebrow">WEBSITE CONTENT</p><h1>Image manager</h1><p>Upload photos and assign them to the homepage or a product.</p></div><button id="logout" class="outline-btn">Sign out</button></div>
<form id="uploadForm" class="upload-form"><label>Image title<input id="imageTitle" required maxlength="80" placeholder="e.g. ROADKING R99 PRO"></label><label>Display location<select id="imageSlot"><option value="product">Product image</option><option value="hero">Homepage banner</option><option value="gallery">Gallery image</option></select></label><label id="productNameLabel">Product name<input id="productName" placeholder="e.g. ROADKING R99 PRO"></label><label>Choose image<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" required></label><button class="gold-btn" type="submit">Upload image</button><p id="uploadMessage" class="message"></p></form>
<h2>Current images</h2><div id="imageList" class="image-list"></div></section></main><script type="module" src="admin.js"></script></body></html>
